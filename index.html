<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Statics — static hosting for small sites</title>
    <meta
      name="description"
      content="Upload HTML files or ZIP static sites and share a public URL. Deployments, passwords, expiry rules and analytics stay attached to your account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Statics — static hosting for small sites" />
    <meta
      property="og:description"
      content="Upload HTML files or ZIP static sites and share a public URL, hosted on the edge."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("statics-theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
